<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SnapBooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="layout">
      <section class="stage-panel">
        <div class="stage-shell">
          <section class="stage-card mode-live" id="cameraStage">
            <div class="viewfinder-corners">
              <span class="corner top-left"></span>
              <span class="corner top-right"></span>
              <span class="corner bottom-left"></span>
              <span class="corner bottom-right"></span>
            </div>
            <div class="film-grain"></div>
            <video id="cameraPreview" autoplay muted playsinline></video>
            <div class="camera-overlay-frame" id="cameraFrame"></div>
            <div class="camera-overlay-text" id="cameraText"></div>
            <div class="empty-camera" id="emptyCamera">
              <span class="material-symbols-outlined">photo_camera</span>
              <p>Enable your camera to start the booth.</p>
            </div>
            <div class="flash-overlay" id="flashOverlay"></div>
            <div class="countdown-overlay hidden" id="countdownOverlay">3</div>
            <div class="error-overlay hidden" id="errorOverlay"></div>
          </section>

          <section class="stage-card mode-editor hidden" id="editorStage">
            <div class="film-grain"></div>
            <div class="result-stage" id="resultStage">
              <video id="resultVideo" playsinline></video>
              <div class="result-overlay-frame" id="resultFrame"></div>
              <div class="result-overlay-text" id="resultText"></div>
            </div>
          </section>
        </div>

        <div class="console" id="console">
          <div class="console-shell">
            <button class="console-button hidden" id="openPreviewButton" type="button" aria-label="Open preview view">
              <span class="material-symbols-outlined">play_circle</span>
              Open Preview
            </button>

            <div class="record-control hidden" id="recordControl">
              <button class="shutter-button" id="snapButton" type="button" aria-label="Start recording">
                <span class="shutter-core">
                  <span class="material-symbols-outlined" id="snapButtonIcon">videocam</span>
                  <span class="shutter-label hidden" id="snapButtonLabel">00:00</span>
                </span>
              </button>
              <div class="recording-timer hidden" id="recordingTimer">00:00</div>
            </div>

            <button class="console-button hidden" id="resultPlayButton" type="button" aria-label="Play video">
              <span class="material-symbols-outlined" id="resultPlayIcon">play_arrow</span>
              Play
            </button>
            <button class="console-button hidden" id="resultSaveButton" type="button" aria-label="Save video">
              <span class="material-symbols-outlined">download</span>
              Save
            </button>
            <button class="console-button hidden" id="resultNewButton" type="button" aria-label="Take new video">
              <span class="material-symbols-outlined">videocam</span>
              Take New
            </button>
            <button class="console-button hidden" id="resultSlideshowButton" type="button" aria-label="Start slideshow">
              <span class="material-symbols-outlined">slideshow</span>
              Slideshow
            </button>
            <button class="console-button hidden" id="resultSettingsButton" type="button" aria-label="Open settings">
              <span class="material-symbols-outlined">tune</span>
              Settings
            </button>
          </div>
        </div>
      </section>
    </main>

    <section class="operator-page hidden" id="operatorPanel" aria-label="Operator settings">
      <div class="operator-dialog" id="operatorDialog">
        <header class="operator-dialog-header" id="operatorDialogHeader">
          <div class="operator-heading">
            <div class="brand operator-dialog-brand">Settings</div>
          </div>
          <button class="icon-button" id="operatorCloseButton" type="button" title="Close operator settings">
            <span class="material-symbols-outlined">close</span>
          </button>
        </header>

        <div class="operator-dialog-body">
          <section class="panel-section">
            <div class="section-header">
              <div>
                <p class="panel-title panel-title-small">Caption</p>
              </div>
            </div>
            <label class="field">
              <span class="field-label">Text</span>
              <input id="textInput" type="text" maxlength="60" placeholder="Type your caption">
            </label>
            <label class="field field-inline">
              <span class="field-label">Font</span>
              <select id="fontSelect">
                <option value="Space Grotesk">Space Grotesk</option>
                <option value="Manrope">Manrope</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
              </select>
            </label>
          </section>

          <section class="panel-section">
            <div class="section-header">
              <div>
                <p class="panel-title panel-title-small">Recording</p>
              </div>
            </div>
            <div class="field field-inline">
              <span class="field-label">Countdown Seconds</span>
              <div class="stepper-control">
                <button class="stepper-button" id="countdownMinusButton" type="button" aria-label="Decrease countdown">
                  <span class="material-symbols-outlined">remove</span>
                </button>
                <input id="countdownInput" type="number" min="0" max="120" step="1" value="3" inputmode="numeric">
                <button class="stepper-button" id="countdownPlusButton" type="button" aria-label="Increase countdown">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </div>
            <div class="field field-inline">
              <span class="field-label">Slideshow After Idle Seconds</span>
              <div class="stepper-control">
                <button class="stepper-button" id="slideshowIdleMinusButton" type="button" aria-label="Decrease slideshow idle timer">
                  <span class="material-symbols-outlined">remove</span>
                </button>
                <input id="slideshowIdleInput" type="number" min="0" max="600" step="1" value="0" inputmode="numeric">
                <button class="stepper-button" id="slideshowIdlePlusButton" type="button" aria-label="Increase slideshow idle timer">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-header">
              <div>
                <p class="panel-title panel-title-small">Branding</p>
              </div>
            </div>
            <button class="console-button secondary-button" id="logoUploadButton" type="button">
              <span class="material-symbols-outlined">image</span>
              Upload Logo
            </button>
            <input id="logoInput" type="file" accept="image/*" class="hidden">
          </section>

          <section class="panel-section">
            <div class="section-header">
              <div>
                <p class="panel-title panel-title-small">Save Folder</p>
              </div>
            </div>
            <button class="console-button secondary-button" id="saveFolderButton" type="button">
              <span class="material-symbols-outlined">folder_open</span>
              Choose Folder
            </button>
            <p class="save-folder-label" id="saveFolderLabel">Browser default downloads</p>
          </section>

          <section class="panel-section">
            <div class="section-header">
              <div>
                <h3 class="panel-title panel-title-small">Frame</h3>
              </div>
            </div>
            <div class="frame-tray operator-frame-tray" id="frameTray"></div>
          </section>
        </div>

        <button class="operator-dialog-resize" id="operatorDialogResize" type="button" aria-label="Resize settings dialog">
          <span class="material-symbols-outlined">open_in_full</span>
        </button>
      </div>
    </section>

    <section class="app-dialog-overlay hidden" id="appDialogOverlay" aria-modal="true" role="dialog" aria-labelledby="appDialogTitle">
      <div class="app-dialog-card">
        <header class="app-dialog-header">
          <h2 class="panel-title panel-title-small" id="appDialogTitle">Message</h2>
          <button class="icon-button" id="appDialogCloseButton" type="button" aria-label="Close message">
            <span class="material-symbols-outlined">close</span>
          </button>
        </header>
        <p class="app-dialog-message" id="appDialogMessage"></p>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
