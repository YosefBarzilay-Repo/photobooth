<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#0e0e0e",
              "primary-fixed": "#ff6ea9",
              "on-secondary-container": "#e8fbff",
              "surface-container-low": "#131313",
              "on-tertiary-container": "#0f0078",
              "surface-container-highest": "#262626",
              "on-surface-variant": "#adaaaa",
              "error-dim": "#d73357",
              "outline-variant": "#494847",
              "secondary": "#00e3fd",
              "surface-container-high": "#201f1f",
              "secondary-dim": "#00d4ec",
              "surface-container-lowest": "#000000",
              "surface-container": "#1a1919",
              "on-tertiary-fixed-variant": "#2c2892",
              "on-primary-container": "#4b0027",
              "secondary-fixed": "#26e6ff",
              "tertiary-container": "#9392ff",
              "tertiary-fixed": "#a9a8ff",
              "secondary-fixed-dim": "#00d7f0",
              "surface-variant": "#262626",
              "inverse-on-surface": "#565554",
              "on-error-container": "#ffb2b9",
              "on-secondary-fixed-variant": "#005964",
              "on-secondary": "#004d57",
              "on-primary": "#610034",
              "on-tertiary": "#1d1686",
              "tertiary": "#a2a2ff",
              "inverse-primary": "#ba0069",
              "on-background": "#ffffff",
              "tertiary-fixed-dim": "#9999ff",
              "primary-dim": "#e10080",
              "on-primary-fixed": "#000000",
              "outline": "#777575",
              "primary-container": "#ff6ea9",
              "on-secondary-fixed": "#003a42",
              "inverse-surface": "#fcf8f8",
              "primary-fixed-dim": "#ff4e9e",
              "error-container": "#a70138",
              "surface-tint": "#ff88b5",
              "surface-dim": "#0e0e0e",
              "surface-bright": "#2c2c2c",
              "tertiary-dim": "#9392ff",
              "on-surface": "#ffffff",
              "secondary-container": "#006875",
              "on-primary-fixed-variant": "#5c0031",
              "on-tertiary-fixed": "#0a0060",
              "on-error": "#490013",
              "primary": "#ff88b5",
              "error": "#ff6e84",
              "surface": "#0e0e0e"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .film-grain {
            position: relative;
        }
        .film-grain::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            border-radius: inherit;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary selection:text-on-primary-container overflow-hidden">
<main class="h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Sidebar: Simplified Tools -->
<aside class="w-full md:w-80 bg-surface-container-low p-8 flex flex-col gap-10 z-20 overflow-y-auto">
<div class="flex items-center gap-4">
<div class="text-2xl font-bold tracking-tighter text-white font-headline uppercase">SNAPBOOTH</div>
</div>
<div class="space-y-8 flex-1">
<!-- Retake Button: High Priority -->
<button class="w-full py-5 rounded-2xl bg-surface-container-highest border-2 border-outline-variant/30 flex items-center justify-center gap-3 hover:bg-surface-bright transition-all active:scale-95">
<span class="material-symbols-outlined text-2xl" data-icon="refresh">refresh</span>
<span class="font-headline font-bold uppercase tracking-widest text-base">Retake Photo</span>
</button>
<!-- Simplified Text Tool -->
<div class="space-y-6 pt-4 border-t border-outline-variant/20">
<div class="space-y-2">
<span class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold">Step 1</span>
<h2 class="text-2xl font-headline font-bold text-white tracking-tight">Add Message</h2>
</div>
<div class="flex flex-col gap-4">
<input class="w-full bg-surface-container-high border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl text-on-surface py-4 px-4 transition-all text-lg placeholder:text-outline/50" placeholder="Type your caption..." type="text"/>
<button class="w-full py-4 rounded-xl bg-white text-black font-headline font-bold uppercase tracking-widest text-sm hover:opacity-90 active:scale-[0.98] transition-all">
                        Update Text
                    </button>
</div>
</div>
</div>
<!-- Start Over / Cancel -->
<button class="flex items-center justify-center gap-2 w-full py-4 text-on-surface-variant hover:text-white transition-colors group">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
<span class="font-headline font-bold uppercase tracking-widest text-xs">Cancel &amp; Start Over</span>
</button>
</aside>
<!-- Center: Large Preview Area -->
<section class="flex-1 relative bg-surface-dim flex items-center justify-center p-6 md:p-12 overflow-hidden">
<!-- Viewfinder Brackets (Decorative) -->
<div class="absolute top-12 left-12 border-t-2 border-l-2 border-outline-variant/30 w-16 h-16"></div>
<div class="absolute top-12 right-12 border-t-2 border-r-2 border-outline-variant/30 w-16 h-16"></div>
<div class="absolute bottom-12 left-12 border-b-2 border-l-2 border-outline-variant/30 w-16 h-16"></div>
<div class="absolute bottom-12 right-12 border-b-2 border-r-2 border-outline-variant/30 w-16 h-16"></div>
<!-- Main Canvas Container -->
<div class="relative max-h-full max-w-2xl w-full aspect-[4/5] bg-surface-container-lowest shadow-2xl film-grain">
<img class="w-full h-full object-cover" data-alt="high fashion portrait of a young woman with neon lighting reflecting on her skin against a dark studio background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvy5BfJNWl_i5nAFiQgGJaARJ658GqDgtG2zLp0tTwfrtPwXN6HVT3OSGb11eSrTGhmA6GT8cWVfOyHfVSNlESaDblh5wOyrmqMtYeh5jnp804YLxzhOR9CQbjXcDDlHYwhvuJFivskXOikwV1NS2cUTcMngMLjyixm87blt7qkMDqHPpbp8g2UY46q6U03j7VeaQmQlQCYr9YkNyGznpIJvN2RPfa8pXdGzJm5WD7Jd5yWtfBF3Z-oge_ovT_ZdHP-PWUr58lucs"/>
<!-- Default Neon Frame -->
<div class="absolute inset-0 border-[20px] border-black/80 pointer-events-none">
<div class="w-full h-full border border-primary/40 shadow-[inset_0_0_20px_rgba(255,136,181,0.2)]"></div>
</div>
<!-- Draggable Text Element -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 cursor-move">
<div class="relative px-6 py-3 bg-primary text-on-primary-fixed font-headline font-bold text-3xl uppercase tracking-tighter rotate-[-2deg] shadow-xl">
                    NEON SOUL
                </div>
</div>
</div>
<!-- GIANT PRINT BUTTON -->
<button class="absolute bottom-12 right-12 flex flex-col items-center justify-center gap-2 bg-primary text-black w-48 h-48 rounded-full font-headline font-black uppercase tracking-widest shadow-[0_20px_50px_rgba(255,136,181,0.4)] hover:scale-110 active:scale-90 transition-all duration-300 z-50 animate-bounce">
<span class="material-symbols-outlined text-6xl" data-icon="print">print</span>
<span class="text-xl">Print Now</span>
</button>
</section>
<!-- Right Sidebar: One-Tap Frame Gallery -->
<aside class="w-full md:w-72 bg-surface-container-low border-l border-outline-variant/15 p-8 flex flex-col gap-6">
<div class="space-y-1">
<span class="font-headline text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold">Step 2</span>
<h3 class="text-2xl font-headline font-bold text-white tracking-tight">Pick Frame</h3>
</div>
<div class="flex md:flex-col gap-6 overflow-x-auto md:overflow-y-auto pb-4 md:pb-0 scrollbar-hide">
<!-- Large One-Tap Frame: Polaroid -->
<button class="flex-shrink-0 w-48 md:w-full group">
<div class="aspect-square bg-white rounded-2xl mb-3 p-4 shadow-lg border-4 border-transparent hover:border-primary transition-all">
<div class="w-full h-full flex flex-col items-center justify-end pb-2">
<div class="w-[90%] h-[75%] bg-surface-container-lowest mb-2"></div>
</div>
</div>
<span class="block text-center font-headline font-bold text-xs uppercase tracking-widest text-on-surface-variant group-hover:text-primary">Classic Polaroid</span>
</button>
<!-- Large One-Tap Frame: Neon (Selected) -->
<button class="flex-shrink-0 w-48 md:w-full group">
<div class="aspect-square bg-surface-container-high rounded-2xl mb-3 p-4 shadow-lg border-4 border-primary transition-all relative overflow-hidden">
<div class="w-full h-full border-4 border-secondary shadow-[0_0_15px_rgba(0,227,253,0.4)] bg-surface-container-lowest"></div>
<div class="absolute inset-0 bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="check_circle">check_circle</span>
</div>
</div>
<span class="block text-center font-headline font-bold text-xs uppercase tracking-widest text-primary">Cyber Neon</span>
</button>
<!-- Large One-Tap Frame: Film Strip -->
<button class="flex-shrink-0 w-48 md:w-full group">
<div class="aspect-square bg-surface-container-high rounded-2xl mb-3 p-4 shadow-lg border-4 border-transparent hover:border-primary transition-all">
<div class="w-full h-full flex flex-col gap-2">
<div class="flex gap-2 h-3"><div class="flex-1 bg-white/20 rounded-sm"></div><div class="flex-1 bg-white/20 rounded-sm"></div><div class="flex-1 bg-white/20 rounded-sm"></div></div>
<div class="flex-1 bg-surface-container-lowest rounded-sm"></div>
<div class="flex gap-2 h-3"><div class="flex-1 bg-white/20 rounded-sm"></div><div class="flex-1 bg-white/20 rounded-sm"></div><div class="flex-1 bg-white/20 rounded-sm"></div></div>
</div>
</div>
<span class="block text-center font-headline font-bold text-xs uppercase tracking-widest text-on-surface-variant group-hover:text-primary">Retro Film</span>
</button>
</div>
</aside>
</main>
<!-- Mobile Bottom Bar: Simplified for Booth -->
<nav class="fixed bottom-0 w-full z-50 pb-safe md:hidden bg-surface-container-low flex justify-around items-center h-24 px-6 border-t border-outline-variant/15">
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="refresh">refresh</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Retake</span>
</button>
<button class="bg-primary text-black h-16 px-10 rounded-full font-headline font-black uppercase tracking-widest shadow-xl flex items-center gap-3">
<span class="material-symbols-outlined text-2xl" data-icon="print">print</span>
        PRINT
    </button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="palette">palette</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Frames</span>
</button>
</nav>
</body></html>
