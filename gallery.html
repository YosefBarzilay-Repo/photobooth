<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="styles/library.css">
</head>
<body class="library-page">
  <div class="library-shell">
    <header class="library-header">
      <div>
        <p class="library-eyebrow">Echo</p>
        <h1 class="library-title">Gallery</h1>
        <p class="library-subtitle" id="gallerySubtitle">Saved videos from the active Echo folder.</p>
      </div>
      <div class="library-actions">
        <button class="library-action" id="galleryOpenFolderButton" type="button">
          <span class="material-symbols-outlined">folder_open</span>
          Open Folder
        </button>
        <button class="library-action" id="galleryRefreshButton" type="button">
          <span class="material-symbols-outlined">refresh</span>
          Refresh
        </button>
      </div>
    </header>

    <main class="gallery-grid" id="galleryGrid"></main>

    <section class="library-empty hidden" id="galleryEmptyState">
      <span class="material-symbols-outlined">video_library</span>
      <h2>No saved videos yet</h2>
      <p>Save a recording from the main Echo window and then refresh this gallery.</p>
    </section>
  </div>

  <script type="module" src="src/galleryWindow.js"></script>
</body>
</html>
