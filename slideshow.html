<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Slideshow</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #f5f4f8; }
  </style>
  <link rel="stylesheet" href="styles/library.css">
</head>
<body class="slideshow-page">
  <div class="slideshow-shell slideshow-shell-external">
    <main class="slideshow-stage slideshow-stage-external">
      <video id="slideshowVideo" class="slideshow-video hidden" playsinline muted autoplay></video>
      <section id="slideshowEmptyState" class="library-empty">
        <div class="slideshow-loader" aria-hidden="true"></div>
        <h2>Loading Slideshow</h2>
        <p>This player loads the current project videos and plays them in a loop.</p>
      </section>
      <div class="slideshow-meta hidden" id="slideshowMeta">
        <span id="slideshowFilename"></span>
        <span id="slideshowCounter"></span>
      </div>
    </main>
  </div>
  <script type="module" src="src/slideshowWindow.js"></script>
</body>
</html>
