<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SnapBooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="layout">
      <section class="stage-panel">
        <div class="stage-shell">
          <section class="stage-card mode-live" id="cameraStage">
            <div class="viewfinder-corners">
              <span class="corner top-left"></span>
              <span class="corner top-right"></span>
              <span class="corner bottom-left"></span>
              <span class="corner bottom-right"></span>
            </div>
            <div class="film-grain"></div>
            <video id="cameraPreview" autoplay muted playsinline></video>
            <div class="camera-controls">
              <button class="shutter-button" id="snapButton" type="button" aria-label="Start recording">
                <span class="shutter-core">
                  <span class="material-symbols-outlined" id="snapButtonIcon">videocam</span>
                </span>
              </button>
              <div class="recording-timer hidden" id="recordingTimer">00:00</div>
            </div>
            <div class="empty-camera" id="emptyCamera">
              <span class="material-symbols-outlined">photo_camera</span>
              <p>Enable your camera to start the booth.</p>
            </div>
            <div class="flash-overlay" id="flashOverlay"></div>
            <div class="countdown-overlay hidden" id="countdownOverlay">3</div>
            <div class="error-overlay hidden" id="errorOverlay"></div>
          </section>

          <section class="stage-card mode-editor hidden" id="editorStage">
            <div class="film-grain"></div>
            <div class="result-stage" id="resultStage">
              <video id="resultVideo" playsinline loop controls></video>
              <div class="result-overlay-frame" id="resultFrame"></div>
              <div class="result-overlay-text" id="resultText"></div>
            </div>
          </section>
        </div>

        <div class="stage-brand-row">
          <div class="brand stage-brand" id="operatorAccessTrigger">SNAPBOOTH</div>
        </div>

        <div class="console">
          <button class="console-button icon-only hidden" id="resultRetakeButton" type="button" aria-label="Retake">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <button class="console-button icon-only hidden" id="anotherShotButton" type="button" aria-label="Another clip">
            <span class="material-symbols-outlined">videocam</span>
          </button>
        </div>
      </section>
    </main>

    <section class="operator-page hidden" id="operatorPanel" aria-label="Operator settings">
      <div class="operator-page-shell">
        <header class="operator-page-header">
          <div class="operator-heading">
            <div class="brand">SNAPBOOTH</div>
          </div>
          <button class="icon-button" id="operatorCloseButton" type="button" title="Close operator settings">
            <span class="material-symbols-outlined">close</span>
          </button>
        </header>

        <div class="operator-layout">
          <aside class="side-panel operator-controls-panel">
            <section class="panel-section">
              <div class="section-header">
                <div>
                  <p class="panel-title panel-title-small">Caption</p>
                </div>
              </div>
              <label class="field">
                <span class="field-label">Text</span>
                <input id="textInput" type="text" maxlength="60" placeholder="Type your caption">
              </label>
              <label class="field field-inline">
                <span class="field-label">Font</span>
                <select id="fontSelect">
                  <option value="Space Grotesk">Space Grotesk</option>
                  <option value="Manrope">Manrope</option>
                  <option value="Georgia">Georgia</option>
                  <option value="Courier New">Courier New</option>
                </select>
              </label>
            </section>

            <section class="panel-section">
              <div class="section-header">
                <div>
                  <p class="panel-title panel-title-small">Recording</p>
                </div>
              </div>
              <div class="field field-inline">
                <span class="field-label">Countdown Seconds</span>
                <div class="stepper-control">
                  <button class="stepper-button" id="countdownMinusButton" type="button" aria-label="Decrease countdown">
                    <span class="material-symbols-outlined">remove</span>
                  </button>
                  <input id="countdownInput" type="number" min="0" max="120" step="1" value="3" inputmode="numeric">
                  <button class="stepper-button" id="countdownPlusButton" type="button" aria-label="Increase countdown">
                    <span class="material-symbols-outlined">add</span>
                  </button>
                </div>
              </div>
            </section>

            <section class="panel-section">
              <div class="section-header">
                <div>
                  <p class="panel-title panel-title-small">Branding</p>
                </div>
              </div>
              <button class="console-button secondary-button" id="logoUploadButton" type="button">
                <span class="material-symbols-outlined">image</span>
                Upload Logo
              </button>
              <input id="logoInput" type="file" accept="image/*" class="hidden">
            </section>

            <section class="panel-section">
              <div class="section-header">
                <div>
                  <p class="panel-title panel-title-small">Save Folder</p>
                </div>
              </div>
              <button class="console-button secondary-button" id="saveFolderButton" type="button">
                <span class="material-symbols-outlined">folder_open</span>
                Choose Folder
              </button>
              <p class="save-folder-label" id="saveFolderLabel">Browser default downloads</p>
            </section>

            <section class="panel-section">
              <div class="section-header">
                <div>
                  <h3 class="panel-title panel-title-small">Frame</h3>
                </div>
              </div>
              <div class="frame-tray operator-frame-tray" id="frameTray"></div>
            </section>
          </aside>

          <section class="operator-preview-panel">
            <div class="stage-shell operator-stage-shell">
              <div class="viewfinder-corners operator-viewfinder-corners">
                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>
              </div>
              <section class="stage-card operator-preview-card">
                <div class="film-grain"></div>
                <div class="operator-preview-surface" id="operatorPreviewSurface">
                  <video id="operatorPreviewVideo" autoplay muted playsinline></video>
                  <div class="operator-preview-frame" id="operatorFrame"></div>
                  <div class="operator-preview-text" id="operatorText"></div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
